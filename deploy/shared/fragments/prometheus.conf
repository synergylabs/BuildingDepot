# Prometheus remote-Grafana exposure — host nginx fragment.
#
# OPTIONAL, and enabled on an INSTRUMENTED host (one running Prometheus), never
# on the Grafana host: each instrumented host's Prometheus is loopback-only
# (127.0.0.1:2080), so when Grafana runs on a different host, this fragment is
# how its datasource reaches this one — HTTPS on 2443, basic auth, and only the
# read-only query API (/api/v1/). The Prometheus UI and lifecycle/admin
# endpoints stay unreachable. A co-located Grafana reads 127.0.0.1:2080
# directly and never needs this.
#
# Enable it via the Prometheus host tooling (the shared nginx base from
# `host.py install` must already be on this host):
#
#   sudo python3 deploy/shared/prometheus.py install --expose-remote-prometheus \
#       --domain <host> --cert <tailscale|http|dns-cloudflare> \
#       --basic-auth <user>:<password>
#
# then open 2443/tcp to the Grafana host.

server {
    listen      2443 ssl;
    listen      [::]:2443 ssl;
    server_name {{ DOMAIN }};

    ssl_certificate     {{ SSL_CERT }};
    ssl_certificate_key {{ SSL_KEY }};

    auth_basic           "prometheus";
    auth_basic_user_file {{ HTPASSWD_FILE }};

    location /api/v1/ {
        proxy_pass http://127.0.0.1:2080;
        include    /etc/nginx/conf.d/proxy-common.conf;
    }

    location / { return 404; }
}
