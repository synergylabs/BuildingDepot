# AMQP and management bind loopback only — external access is through
# nginx (wss:15675 -> ws:15674 for web-STOMP) or not exposed at all.
listeners.tcp.local = 127.0.0.1:5672
management.tcp.ip   = 127.0.0.1

# web-STOMP plain ws on loopback; nginx terminates TLS and proxies wss:15675
# to this. Keeping the key out of the broker avoids permission issues.
web_stomp.tcp.listener = 127.0.0.1:15674

# --- Authentication and authorization ---
# Two backends, tried in order. Internal users (bdadmin: ops and the ingest
# publisher) authenticate and authorize via the internal backend. Everyone else
# presents a BuildingDepot OAuth token as the password; the HTTP backend asks
# CentralService to validate it and authorize per sensor. Decisions are cached
# briefly so BD is not called on every operation. Adding the HTTP backend does
# not change internal users; it is purely additive.
auth_backends.1 = internal
auth_backends.2 = cache

auth_cache.cached_backend = http
auth_cache.cache_ttl      = 30000

auth_http.http_method   = post
auth_http.user_path     = http://127.0.0.1:8081/rabbitmq/user
auth_http.vhost_path    = http://127.0.0.1:8081/rabbitmq/vhost
auth_http.resource_path = http://127.0.0.1:8081/rabbitmq/resource
auth_http.topic_path    = http://127.0.0.1:8081/rabbitmq/topic
